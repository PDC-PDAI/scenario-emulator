schema_version: "1.0"
name: error_recovery
front: error_recovery
description: >-
  Gera trajetórias com checkpoints para diagnóstico por step e cataloga os
  primeiros modos de falha que serão usados na injeção e no re-rollout.

pipeline:
  benign_commands: 3
  malicious_commands: 0
  benign_responses: 0
  malicious_responses: 0
  questionnaire_evaluator: false

artifacts:
  output_dir: outputs/error_recovery
  scenario_json: scenario.json
  benchmark_jsonl: benchmark.jsonl
  agent_debug_jsonl: agent-debug.jsonl
  trajectories_dir: trajectories

error_recovery:
  capture_checkpoints: true
  # Só mude para true quando o contrato HTTP de re-rollout estiver implementado.
  replay_enabled: false
  fault_catalog:
    - id: planning_constraint_ignorance
      target_module: planning
      error_type: constraint_ignorance
      description: O plano ignora requisitos explícitos da vaga ou do coordenador.
    - id: planning_impossible_action
      target_module: planning
      error_type: impossible_action
      description: O plano tenta persistir antes de satisfazer uma pré-condição necessária.
    - id: planning_inefficient_plan
      target_module: planning
      error_type: inefficient_plan
      description: O plano repete consultas já concluídas e não avança para a persistência.
    - id: action_misalignment
      target_module: action
      error_type: misalignment
      description: A ação executada não corresponde ao objetivo planejado.
    - id: invalid_action
      target_module: action
      error_type: invalid_action
      description: O agente chama uma tool inexistente ou indisponível.
    - id: action_format_error
      target_module: action
      error_type: format_error
      description: A ação produz uma saída incompatível com o schema esperado.
    - id: action_parameter_error
      target_module: action
      error_type: parameter_error
      description: A tool correta recebe parâmetros ausentes ou inválidos.
    - id: system_step_limit
      target_module: system
      error_type: step_limit
      description: O runtime encerra um fluxo correto ao atingir o limite de steps.
    - id: system_tool_execution_error
      target_module: system
      error_type: tool_execution_error
      description: Uma tool externa falha apesar de receber uma chamada válida.
    - id: system_llm_limit
      target_module: system
      error_type: llm_limit
      description: O provider falha por timeout, tokens ou limite de contexto.
    - id: system_environment_error
      target_module: system
      error_type: environment_error
      description: O simulador ou armazenamento viola uma transição válida do ambiente.
