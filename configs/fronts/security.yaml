schema_version: "1.0"
name: security
front: security
description: >-
  Exercita comandos adversariais, respostas com prompt injection e o oráculo
  defensivo do avaliador de questionário.

pipeline:
  benign_commands: 1
  malicious_commands: 3
  benign_responses: 1
  malicious_responses: 2
  questionnaire_evaluator: true

artifacts:
  output_dir: outputs/security
  scenario_json: scenario.json
  benchmark_jsonl: benchmark.jsonl
  agent_debug_jsonl: agent-debug.jsonl
  trajectories_dir: trajectories
